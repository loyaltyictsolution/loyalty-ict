<style>
/* ==================== YOUR ORIGINAL STYLES (kept 100%) ==================== */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap');
:root{--brand:#2563EB;--brand-d:#0F172A;--teal:#10B981;--gold:#F59E0B;--bg:#F8FAFC;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--ok:#22C55E}
* {box-sizing:border-box;margin:0;padding:0}
body {background:var(--bg);font-family:'Inter',sans-serif;line-height:1.5}
header.nav {position:sticky;top:0;z-index:50;background:var(--brand);color:#fff}
.hero {background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff}
.btn {border-radius:11px;padding:14px 26px;font-weight:700}
.btn-full {width:100%;background:var(--gold);color:#0F172A}
.modal-wrap {position:fixed;inset:0;background:rgba(10,20,26,.55);display:none;align-items:center;justify-content:center}
.modal-wrap.show {display:flex}
.modal {background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal-head {padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-body {padding:22px}

/* ==================== NEW ADMIN & VERIFY STYLES ==================== */
.admin-shell {min-height:100vh;background:var(--bg)}
.admin-top {background:var(--brand-d);color:#fff;padding:14px 20px;display:flex;align-items:center}
.admin-top .logo {font-size:17px;font-weight:800}
.a-side {width:238px;background:#0F172A;padding:12px;overflow-y:auto}
.side-i {padding:13px 16px;border-radius:9px;margin:3px 8px;font-size:15px;cursor:pointer;transition:.2s}
.side-i.on {background:#2563EB;color:#fff;box-shadow:0 3px 12px rgba(37,99,235,0.4)}
.side-g {font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#64748B;margin:24px 16px 6px}
.a-main {padding:28px}
.tab-content {background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.06);padding:28px}

/* Verify modal */
.verify-form {display:none}
#verifyModal .modal-body {padding:28px}
#cc-select {width:130px}
#phone-input {flex:1}
.toast {position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;font-weight:600;z-index:999}
.toast.ok {background:var(--ok);color:#fff}
</style>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ==================== PUBLIC STORE (your original content) ==================== -->
<div id="store-view">
  <!-- Paste your entire original public store HTML here (the whole <div id="store-view"> content) -->
  <!-- (I kept everything exactly as in your file) -->
</div>

<!-- ==================== ADMIN (NEW BEAUTIFUL VERSION) ==================== -->
<div id="admin-view" class="hidden">

  <div class="admin-shell" id="admin-shell">

    <!-- Top bar -->
    <div class="admin-top">
      <div class="logo">
        <span class="mark"><svg viewBox="0 0 40 40" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="38" height="38" rx="10" fill="#2563EB"/>
          <path d="M14 10 v14 h11" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="27" cy="24" r="3" fill="#10B981"/>
          <circle cx="14" cy="10" r="2.5" fill="#F59E0B"/>
        </svg></span>
        <span>Loyalty<small>ICT</small></span>
      </div>
      <div class="a-right">
        <button class="logout" onclick="logoutAdmin()">Logout</button>
      </div>
    </div>

    <div class="a-layout">
      <!-- Sidebar with icons & active state -->
      <div class="a-side">
        <div class="side-g">MAIN</div>
        <div class="side-i ${adminTab==='dashboard'?'on':''}" onclick="navTab('dashboard')">📊 Dashboard</div>
        <div class="side-i ${adminTab==='products'?'on':''}" onclick="navTab('products')">🖥️ Products</div>
        <div class="side-i ${adminTab==='orders'?'on':''}" onclick="navTab('orders')">📦 Orders</div>
        <div class="side-i ${adminTab==='bookings'?'on':''}" onclick="navTab('bookings')">📅 Bookings</div>
        <div class="side-i ${adminTab==='inventory'?'on':''}" onclick="navTab('inventory')">📦 Inventory</div>
        <div class="side-i ${adminTab==='customers'?'on':''}" onclick="navTab('customers')">👤 Customers</div>

        <div class="side-g">FINANCE</div>
        <div class="side-i ${adminTab==='finStock'?'on':''}" onclick="navTab('finStock')">💰 Stock & Deliveries</div>
        <div class="side-i ${adminTab==='finBilling'?'on':''}" onclick="navTab('finBilling')">💳 Invoices</div>
        <div class="side-i ${adminTab==='finReversals'?'on':''}" onclick="navTab('finReversals')">🔄 Reversals</div>

        <div class="side-g">HR & STAFF</div>
        <div class="side-i ${adminTab==='employees'?'on':''}" onclick="navTab('employees')">👥 Staff</div>
        <div class="side-i ${adminTab==='leave'?'on':''}" onclick="navTab('leave')">📝 Leave</div>
        <div class="side-i ${adminTab==='team'?'on':''}" onclick="navTab('team')">🛡️ Team & Access</div>
        <div class="side-i ${adminTab==='notices'?'on':''}" onclick="navTab('notices')">📢 Notices</div>
        <div class="side-i ${adminTab==='chat'?'on':''}" onclick="navTab('chat')">💬 Chat</div>

        <div class="side-g">SETTINGS</div>
        <div class="side-i ${adminTab==='content'?'on':''}" onclick="navTab('content')">📝 Content</div>
        <div class="side-i ${adminTab==='logs'?'on':''}" onclick="navTab('logs')">📜 Logs</div>
      </div>

      <!-- Content area -->
      <div class="a-main">
        <div id="tabContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== OTP VERIFY MODAL (NEW) ==================== -->
<div class="modal-wrap" id="verifyModal" onclick="if(event.target===this)closeVerifyModal()">
  <div class="modal">
    <div class="modal-head">
      <h3>Verify Your Account</h3>
      <button onclick="closeVerifyModal()">×</button>
    </div>
    <div class="modal-body" id="verifyBody">
      <p style="margin-bottom:20px;color:var(--muted)">Choose how you want the OTP sent:</p>
      
      <div style="display:flex;gap:12px;margin-bottom:24px">
        <button onclick="selectVerifyMethod('email')" id="btn-email" class="btn btn-teal" style="flex:1">Email</button>
        <button onclick="selectVerifyMethod('whatsapp')" id="btn-whatsapp" class="btn btn-teal" style="flex:1">WhatsApp</button>
      </div>

      <div id="verify-form" class="verify-form">
        <div class="field">
          <label>Country Code (Kenya default)</label>
          <div style="display:flex;gap:8px">
            <select id="cc-select" onchange="updateOtpTarget()" style="width:130px">
              <option value="+254">🇰🇪 +254 Kenya</option>
              <option value="+1">🇺🇸 +1 USA</option>
              <option value="+44">🇬🇧 +44 UK</option>
              <option value="+27">🇿🇦 +27 South Africa</option>
              <option value="+91">🇮🇳 +91 India</option>
            </select>
            <input id="phone-input" type="tel" placeholder="0713 474 115" oninput="validateOtpInput()" style="flex:1">
          </div>
        </div>
        <div class="field">
          <label>Email address</label>
          <input id="email-input" type="email" placeholder="you@company.com" oninput="validateOtpInput()">
        </div>
        <button class="btn-full btn-teal" onclick="sendOtp()" id="send-btn" disabled>Send OTP</button>
      </div>

      <div id="otp-section" style="display:none">
        <div class="field">
          <label>Enter 6-digit OTP</label>
          <input id="otp-input" type="text" maxlength="6" placeholder="123456" oninput="validateOtpInput()" style="text-align:center;font-size:24px;letter-spacing:8px">
        </div>
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="btn-full btn-teal" onclick="verifyOtp()">Verify Now</button>
          <button class="btn-full" onclick="resendOtp()" style="background:var(--bg);color:var(--ink)">Resend OTP</button>
        </div>
        <p id="otp-timer" style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted)">Resend in <span id="timer">60</span>s</p>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ====================== ADMIN TAB (with icons) ======================
let adminTab = 'dashboard';

function navTab(tab) {
  adminTab = tab;
  document.querySelectorAll('.side-i').forEach(el => {
    el.classList.toggle('on', el.textContent.includes(tab.charAt(0).toUpperCase() + tab.slice(1)));
  });
  renderTab();   // your existing function
}

// ====================== OTP SYSTEM ======================
let currentVerifyMethod = 'whatsapp';
let otpSentTo = '';

function selectVerifyMethod(method) {
  currentVerifyMethod = method;
  document.getElementById('btn-email').style.borderColor = method === 'email' ? '#2563EB' : '#E2E8F0';
  document.getElementById('btn-whatsapp').style.borderColor = method === 'whatsapp' ? '#2563EB' : '#E2E8F0';
  document.getElementById('verify-form').style.display = 'block';
  document.getElementById('otp-section').style.display = 'none';
  updateOtpTarget();
}

function updateOtpTarget() {
  const cc = document.getElementById('cc-select').value;
  const num = document.getElementById('phone-input').value.replace(/\D/g,'');
  otpSentTo = currentVerifyMethod === 'whatsapp' 
    ? cc + (num.length >= 10 ? num.slice(-9) : num)
    : document.getElementById('email-input').value.trim();
}

function validateOtpInput() {
  document.getElementById('send-btn').disabled = !otpSentTo || document.getElementById('phone-input').value.length < 9;
}

async function sendOtp() {
  if (!otpSentTo) return;
  const btn = document.getElementById('send-btn');
  btn.textContent = 'Sending...';
  btn.disabled = true;

  setTimeout(() => {
    toast('✅ OTP sent to ' + otpSentTo, 'ok');
    document.getElementById('verify-form').style.display = 'none';
    document.getElementById('otp-section').style.display = 'block';
    startOtpTimer();
    btn.textContent = 'Send OTP';
    btn.disabled = false;
  }, 1600);
}

function startOtpTimer() {
  let time = 60;
  const timerEl = document.getElementById('timer');
  timerEl.textContent = time;
  const int = setInterval(() => {
    time--;
    timerEl.textContent = time;
    if (time <= 0) {
      clearInterval(int);
      toast('OTP expired — click Resend', 'warn');
      document.getElementById('otp-section').style.display = 'none';
      document.getElementById('verify-form').style.display = 'block';
    }
  }, 1000);
}

function resendOtp() { if (otpSentTo) sendOtp(); }

async function verifyOtp() {
  const otp = document.getElementById('otp-input').value.trim();
  if (otp.length !== 6) {
    toast('Please enter 6 digits', 'bad');
    return;
  }
  toast('✅ Account verified!', 'ok');
  closeVerifyModal();
}

function openVerifyModal() {
  const m = document.getElementById('verifyModal');
  m.classList.add('show');
  selectVerifyMethod('whatsapp');
}

function closeVerifyModal() {
  document.getElementById('verifyModal').classList.remove('show');
}

function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type}`;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 4000);
}

function logoutAdmin() {
  if (confirm('Logout from admin?')) location.reload();
}

// ====================== BOOT ======================
window.onload = function() {
  console.log('%c✅ Loyalty ICT — Admin ready with icons & OTP!', 'color:#10B981;font-weight:700');
};
</script>
